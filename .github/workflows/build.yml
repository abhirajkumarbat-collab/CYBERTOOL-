name: Build CyberTool APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        # Subfolder search and navigate
        TARGET=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
        if [ -n "$TARGET" ]; then
          cd "$(dirname "$TARGET")"
        fi
        
        # Build using exact Gradle 8.5 environment
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberTool-Debug-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
